<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#11182b"><meta name="description" content="Your personal comeback dashboard"><link rel="manifest" href="manifest.webmanifest"><title>Snamberi OS</title><style>
:root{color-scheme:dark;--bg:#0b1020;--panel:#151d31;--panel2:#1d2840;--line:#2b3954;--text:#eaf0ff;--muted:#9baac7;--accent:#77aaff;--green:#61d8a8;--gold:#ffc779}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{max-width:1180px;margin:auto;padding:22px 18px 95px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.logo{font-size:24px;font-weight:850;letter-spacing:-.7px}.logo span{color:var(--accent)}.sub{color:var(--muted);font-size:13px}.pill{border:1px solid var(--line);background:var(--panel);padding:8px 12px;border-radius:99px;font-size:13px}.nav{display:flex;gap:7px;overflow-x:auto;padding-bottom:9px;margin-bottom:15px}.nav button{background:var(--panel);color:var(--muted);border:1px solid var(--line);border-radius:11px;padding:10px 14px;white-space:nowrap}.nav button.active{background:#25416b;color:#fff;border-color:#5074b0}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:17px;margin-bottom:12px}.card h2{font-size:17px;margin:0 0 12px}.metric{font-size:28px;font-weight:800}.muted{color:var(--muted)}.small{font-size:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.stack{display:flex;flex-direction:column;gap:10px}.btn{border:1px solid #557db9;background:#31558b;color:#fff;padding:10px 14px;border-radius:10px;font-weight:650}.btn.secondary{background:var(--panel2);border-color:var(--line)}.btn.danger{background:#5a2d42;border-color:#85435b}.field{background:#0d1527;border:1px solid #344463;border-radius:9px;color:var(--text);padding:10px;width:100%;min-width:0}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.formgrid .wide{grid-column:1/-1}.entry{padding:11px 0;border-bottom:1px solid var( <style id="glass-v2">
:root{color-scheme:dark;--bg:#080d1c;--panel:rgba(35,48,77,.42);--panel2:rgba(65,85,129,.30);--line:rgba(210,229,255,.17);--text:#f4f7ff;--muted:#a7b7d4;--accent:#9cc4ff;--green:#85e2c6;--gold:#ffd6a1}
html{min-height:100%;background:#080d1c}body{min-height:100vh;background:radial-gradient(ellipse 80% 40% at 15% -10%,#4668a85c,transparent 80%),radial-gradient(ellipse 65% 40% at 95% 45%,#473e8e4d,transparent 80%),linear-gradient(160deg,#0c142a,#080b17 72%);background-attachment:fixed;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,system-ui,sans-serif;letter-spacing:-.1px}

3px}.glass-hero{padding:21px 20px;border-radius:25px;background:linear-gradient(135deg,#8fb6f53b,#bba4f026);border:1px solid #d9e7ff45;margin-bottom:14px;box-shadow:inset 0 1px #ffffff44}.glass-hero h1{font-size:27px;margin:4px 0 7px;letter-spacing:-1px}.glass-hero p{color:#c7d4ea;margin:0;font-size:13px;line-height:1.6}.ai-actions{display:flex;gap:9px;flex-wrap:wrap}.ai-actions .btn{flex:1}.week-list{display:none}@media(max-width:720px){.week-grid{grid-template-columns:1fr;gap:7px}.week-day{display:flex;align-items:flex-start;gap:10px;padding:10px 12px}.week-day h3{width:52px;flex-shrink:0;margin:8px 0}.week-chip{flex:1;margin:0}.week-list{display:block}.shell{padding-left:12px;padding-right:12px}.card{padding:17px}.nav{top:5px}.top{gap:8px}.pill{font-size:11px}.logo{font-size:22px}}@media(prefers-reduced-motion:no-preference){.card,.glass-hero{animation:glassIn .3s ease-out both}@keyframes glassIn{from{opacity:.65;transform:translateY(5px)}to{opacity:1;transform:none}}}
</style></head><body><main class="shell"><header class="top"><div><div class="logo">SNAMBERI <span>OS</span></div><div class="sub">Your comeback, one day at a time.</div></div><div class="pill" id="levelPill">Level 1 · 0 XP</div></header><nav class="nav" id="nav"></nav><section id="view"></section></main><script>
const KEY='snamberi-os-v1';const today=()=>new Date().toLocaleDateString('en-CA');const iso=d=>[d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const defaults={habits:[{id:'skin-am',name:'Morning skincare',category:'Skincare'},{id:'skin-pm',name:'Evening skincare',category:'Skincare'},{id:'water',name:'Choose water regularly',category:'Nutrition'},{id:'meals',name:'Eat regular balanced meals',category:'Nutrition'},{id:'breaks',name:'Take movement breaks',category:'Wellbeing'},{id:'sleep',name:'Make time for sleep',category:'Sleep'}],checks:{},events:[],workouts:[],meals:[],sleep:[],performance:[],weight:[],notes:[],settings:{},started:'2026-11-21'};let state;try{state={...structuredClone(defaults),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{state=structuredClone(defaults)};const save=()=>{localStorage.setItem(KEY,JSON.stringify(state));render();syncReminders()};let tab='Dashboard',selected=today(),month=new Date();const tabs=['Dashboard','Calendar','Habits','Gym','Nutrition','Sleep','Skincare','Progress','Settings'];const btn=(label,fn,cls='')=>`<button class="btn ${cls}" data-action="${fn}">${label}</button>`;const card=(title,body)=>`<article class="card"><h2>${title}</h2>${body}</article>`;const inp=(id,label,type='text',value='',extra='')=>`<label class="stack"><span class="small muted">${label}</span><input class="field" id="${id}" type="${type}" value="${esc(value)}" ${extra}></label>`;const sel=(id,label,options)=>`<label class="stack"><span class="small muted">${label}</span><select class="field" id="${id}">${options.map(o=>`<option>${esc(o)}</option>`).join('')}</select></label>`;const val=id=>document.getElementById(id)?.value.trim()||'';const record=(arr,obj)=>{state[arr].push({id:crypto.randomUUID(),...obj});save()};const remove=(arr,id)=>{state[arr]=state[arr].filter(x=>x.id!==id);save()};const completed=(date)=>Object.values(state.checks[date]||{}).filter(Boolean).length;const xp=()=>Object.values(state.checks).reduce((a,d)=>a+Object.values(d).filter(Boolean).length*10,0)+state.workouts.length*25+state.events.filter(e=>e.done).length*15+state.sleep.length*5+state.performance.length*5;const level=()=>Math.floor(xp()/150)+1;const log=(items,arr,fmt)=>items.length?items.slice().reverse().slice(0,25).map(x=>`<div class="entry"><div>${fmt(x)}</div><button class="btn secondary small" data-remove="${arr}:${x.id}" aria-label="Delete entry">×</button></div>`).join(''):'<p class="muted small">Nothing logged yet.</p>';
function dashboard(){let n=completed(today()),total=state.habits.length,upcoming=state.events.filter(x=>x.date>=today()&&!x.done).sort((a,b)=>a.date.localeCompare(b.date)).slice(0,5);return `<div class="grid">${[['Level',level()],['XP',xp()],['Habits today',`${n}/${total}`]].map(([a,b])=>`<div class="card"><div class="muted small">${a}</div><div class="metric">${b}</div></div>`).join('')}</div>${card('Today · '+today(),`<div class="progress"><div style="width:${total?100*n/total:0}%"></div></div><div class="stack" style="margin-top:12px">${state.habits.map(h=>habitRow(h,today())).join('')}</div>`)}${card('Coming up',upcoming.length?upcoming.map(e=>`<div class="entry"><div><b>${esc(e.title)}</b><div class="muted small">${esc(e.date)} · ${esc(e.type)}</div></div><span class="tag">Scheduled</span></div>`).join(''):'<p class="muted small">No upcoming events. Add them in Calendar.</p>')}${card('A reminder','<div class="notice">Progress is about consistency, recovery and feeling better—not punishing yourself for a missed day. Your rest days count.</div>')}`}
function habitRow(h,date){let checked=!!state.checks[date]?.[h.id];return `<label class="entry"><span><b>${esc(h.name)}</b><div class="muted small">${esc(h.category)}</div></span><input class="check" type="checkbox" data-check="${esc(date)}|${esc(h.id)}" ${checked?'checked':''}></label>`}
function calendar(){let first=new Date(month.getFullYear(),month.getMonth(),1),offset=(first.getDay()+6)%7,days=new Date(month.getFullYear(),month.getMonth()+1,0).getDate(),cells=Array.from({length:offset},()=>'<div class="day blank"></div>');for(let i=1;i<=days;i++){let d=iso(new Date(month.getFullYear(),month.getMonth(),i)),events=state.events.filter(e=>e.date===d);cells.push(`<button class="day ${d===selected?'selected':''} ${d===today()?'today':''}" data-date="${d}"><b>${i}</b><span class="dots">${events.slice(0,2).map(e=>`${e.done?'✓':'•'} ${esc(e.title)}`).join('<br>')}${events.length>2?` +${events.length-2}`:''}</span></button>`)}let ev=state.events.filter(e=>e.date===selected);return `${card('Calendar',`<div class="calendarhead"><button class="btn secondary" data-action="prev">‹</button><b>${month.toLocaleDateString('en-US',{month:'long',year:'numeric'})}</b><button class="btn secondary" data-action="next">›</button></div><div class="calendar">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div class="weekday">${x}</div>`).join('')}${cells.join('')}</div>`)}${card('Selected day · '+selected,`<div class="stack">${ev.map(e=>`<div class="entry"><div><b>${esc(e.title)}</b><div class="muted small">${esc(e.type)} ${e.time?'· '+esc(e.time):''}</div></div><div class="row"><input class="check" type="checkbox" data-event="${e.id}" ${e.done?'checked':''}><button class="btn secondary" data-remove="events:${e.id}">×</button></div></div>`).join('')||'<p class="muted small">No events this day.</p>'}</div><form id="eventForm" class="formgrid" style="margin-top:12px">${inp('eventTitle','Activity','text','','required')}${sel('eventType','Category',['Basketball','Gym','Skincare','Nutrition','Sleep','Coding','Rest','Other'])}${inp('eventTime','Time (optional)','time')}<div class="stack" style="justify-content:flex-end"><button class="btn">Add event</button></div></form>`)}${card('Weekly basketball routine','<p class="muted small">Your usual basketball days: Monday, Wednesday and Friday. Add recurring practices using the button below.</p>'+btn('Add next 4 weeks of basketball','seedBall','secondary'))}`}
function habits(){return `${card('Daily habits',`<p class="muted small">Check off what you actually did today. No streak penalties.</p>${state.habits.map(h=>habitRow(h,today())).join('')}`)}${card('Add a habit',`<form id="habitForm" class="formgrid">${inp('habitName','Habit name','text','','required')}${sel('habitCategory','Category',['Wellbeing','Skincare','Nutrition','Sleep','Gym','Basketball','Other'])}<button class="btn wide">Add habit</button></form>`)}${card('Manage habits',state.habits.map(h=>`<div class="entry"><span>${esc(h.name)}</span><button class="btn secondary" data-habitremove="${h.id}">Remove</button></div>`).join(''))}`}
function gym(){return `${card('Log a gym workout',`<form id="gymForm" class="formgrid">${inp('gymDate','Date','date',today())}${sel('gymFocus','Focus',['Upper body','Lower body','Full body','Mobility','Easy cardio','Core','Other'])}${inp('gymExercise','Exercise / activity','text','','required')}${inp('gymSets','Sets','number','','min="0" max="50"')}${inp('gymReps','Reps','number','','min="0" max="500"')}${inp('gymKg','Weight (kg, optional)','number','','min="0" step="0.5"')}<button class="btn wide">Save workout</button></form>`)}${card('Workout history',log(state.workouts,'workouts',x=>`<b>${esc(x.exercise)}</b><div class="muted small">${esc(x.date)} · ${esc(x.focus)} · ${esc(x.sets||'–')} × ${esc(x.reps||'–')} ${x.kg?'· '+esc(x.kg)+' kg':''}</div>`))}<div class="notice">Start gradually after time away from training. With a previous ACL injury, confirm readiness for high-intensity lower-body work with a qualified professional.</div>`}
function nutrition(){return `${card('Meals & hydration',`<p class="muted small">Log meals without calorie counting. Regular meals and adequate fuel support growth, training and recovery.</p><form id="mealForm" class="formgrid">${inp('mealDate','Date','date',today())}${sel('mealType','Type',['Breakfast','Lunch','Dinner','Snack','Drink'])}${inp('mealDesc','What did you have?','text','','required')}<button class="btn wide">Add entry</button></form>`)}${card('Food journal',log(state.meals,'meals',x=>`<b>${esc(x.desc)}</b><div class="muted small">${esc(x.date)} · ${esc(x.type)}</div>`))}`}
function sleep(){let recent=state.sleep.slice(-7),avg=recent.length?(recent.reduce((a,x)=>a+Number(x.hours),0)/recent.length).toFixed(1):'—';return `<div class="grid"><div class="card"><div class="muted small">Recent average</div><div class="metric">${avg} h</div></div><div class="card"><div class="muted small">Recommended at 16</div><div class="metric">8–10 h</div></div></div>${card('Log sleep',`<form id="sleepForm" class="formgrid">${inp('sleepDate','Wake-up date','date',today())}${inp('sleepHours','Hours slept','number','','min="0" max="24" step="0.25" required')}${sel('sleepEnergy','How do you feel?',['Good','Okay','Tired'])}<button class="btn wide">Save sleep</button></form>`)}${card('Sleep history',log(state.sleep,'sleep',x=>`<b>${esc(x.hours)} hours</b><div class="muted small">${esc(x.date)} · ${esc(x.energy)}</div>`))}`}
function skincare(){let hs=state.habits.filter(h=>h.category==='Skincare');return `${card('Skincare checklist',hs.map(h=>habitRow(h,today())).join('')||'<p>No skincare habits yet.</p>')}${card('Simple routine',`<div class="entry"><div><b>Morning</b><div class="muted small">Gentle cleanser (if needed), moisturizer, SPF 30+ sunscreen</div></div></div><div class="entry"><div><b>Evening</b><div class="muted small">Gentle cleanser and moisturizer</div></div></div><p class="muted small">Start simple. Introduce products gradually, especially if your skin is sensitive.</p>`)}`}
function progress(){let dates=Array.from({length:7},(_,i)=>{let d=new Date();d.setDate(d.getDate()-(6-i));return iso(d)}),max=Math.max(1,...dates.map(d=>completed(d)));return `${card('Last 7 days · completed habits',`<div class="chart">${dates.map(d=>`<div class="barwrap"><div class="small muted">${completed(d)}</div><div class="bar" style="height:${Math.max(3,completed(d)/max*105)}px"></div><div class="small muted">${d.slice(5)}</div></div>`).join('')}</div>`)}${card('Basketball performance',`<form id="performanceForm" class="formgrid">${inp('perfDate','Date','date',today())}${sel('perfType','Session',['Practice','Game','Conditioning'])}${inp('perfNotes','Performance notes','text','','required')}<button class="btn wide">Log session</button></form>${log(state.performance,'performance',x=>`<b>${esc(x.type)}</b><div class="muted small">${esc(x.date)} · ${esc(x.notes)}</div>`)}`)}${card('Optional body metrics',`<p class="muted small">Weight is optional and not the main measure of progress, especially while you are still growing.</p><form id="weightForm" class="formgrid">${inp('weightDate','Date','date',today())}${inp('weightKg','Weight (kg)','number','','min="1" max="500" step="0.1" required')}<button class="btn wide">Save entry</button></form>${log(state.weight,'weight',x=>`<b>${esc(x.kg)} kg</b><div class="muted small">${esc(x.date)}</div>`)}`)}`}
function syncReminders(){if(window.AndroidReminders){try{window.AndroidReminders.sync(JSON.stringify({events:state.events,reminders:state.settings.reminders||{}}))}catch(e){console.warn(e)}}}
function reminderControls(){let r=state.settings.reminders||{};return card('Phone notifications',`<p class="muted small">Allow notifications when Android asks. Reminders are scheduled on this phone and work when the app is closed. Android may delay alarms to conserve battery.</p><div class="stack">${[['skinAM','Morning skincare','08:00'],['skinPM','Evening skincare','21:00'],['bedtime','Bedtime','22:30'],['basketball','Basketball practice','16:00'],['gym','Gym workout','17:00']].map(([id,label,time])=>`<label class="entry"><span><b>${label}</b><div class="muted small">${id==='basketball'?'Monday, Wednesday, Friday':id==='gym'?'Tuesday, Thursday, Saturday':'Every day'}</div></span><input type="time" class="field" style="max-width:115px" data-reminder="${id}" value="${esc(r[id]??time)}"></label>`).join('')}</div><p class="muted small">Clear a time to disable that reminder. Calendar events with a time receive a reminder at their start.</p>`)}
function settings(){return reminderControls()+ `${card('Your data',`<p class="muted small">All information is stored locally in this browser on this device. No account or cloud sync. Back up regularly before clearing browser data.</p><div class="stack">${btn('Export backup (JSON)','export','secondary')}<label class="btn secondary" style="text-align:center">Import backup <input type="file" id="importFile" accept="application/json" hidden></label>${btn('Clear all saved data','reset','danger')}</div>`)}${card('Install on phone or PC','<p class="muted small">Host these files on HTTPS, then use your browser’s “Add to Home screen” or “Install app” option. Opening the HTML file directly works for basic use but cannot install as a PWA or work offline through a service worker.</p>')}`}
function render(){document.getElementById('levelPill').textContent=`Level ${level()} · ${xp()} XP`;document.getElementById('nav').innerHTML=tabs.map(t=>`<button class="${t===tab?'active':''}" data-tab="${t}">${t}</button>`).join('');document.getElementById('view').innerHTML=({Dashboard:dashboard,Calendar:calendar,Habits:habits,Gym:gym,Nutrition:nutrition,Sleep:sleep,Skincare:skincare,Progress:progress,Settings:settings}[tab])()}
const handlers={habitForm:()=>{let name=val('habitName');if(name){state.habits.push({id:crypto.randomUUID(),name,category:val('habitCategory')});save()}},eventForm:()=>{if(val('eventTitle'))record('events',{date:selected,title:val('eventTitle'),type:val('eventType'),time:val('eventTime'),done:false})},gymForm:()=>{if(val('gymExercise'))record('workouts',{date:val('gymDate'),focus:val('gymFocus'),exercise:val('gymExercise'),sets:val('gymSets'),reps:val('gymReps'),kg:val('gymKg')})},mealForm:()=>{if(val('mealDesc'))record('meals',{date:val('mealDate'),type:val('mealType'),desc:val('mealDesc')})},sleepForm:()=>{if(val('sleepHours'))record('sleep',{date:val('sleepDate'),hours:val('sleepHours'),energy:val('sleepEnergy')})},performanceForm:()=>{if(val('perfNotes'))record('performance',{date:val('perfDate'),type:val('perfType'),notes:val('perfNotes')})},weightForm:()=>{if(val('weightKg'))record('weight',{date:val('weightDate'),kg:val('weightKg')})}};
document.addEventListener('submit',e=>{if(handlers[e.target.id]){e.preventDefault();handlers[e.target.id]()}});document.addEventListener('change',async e=>{let el=e.target;if(el.dataset.reminder){state.settings.reminders??={};state.settings.reminders[el.dataset.reminder]=el.value;save()}if(el.dataset.check){let [d,id]=el.dataset.check.split('|');state.checks[d]??={};state.checks[d][id]=el.checked;save()}if(el.dataset.event){let ev=state.events.find(x=>x.id===el.dataset.event);if(ev){ev.done=el.checked;save()}}if(el.id==='importFile'&&el.files[0]){try{let data=JSON.parse(await el.files[0].text());if(!Array.isArray(data.habits)||!Array.isArray(data.events))throw Error('Invalid backup');if(confirm('Replace your current data with this backup?')){state={...structuredClone(defaults),...data};save()}}catch(err){alert('Could not import backup: '+err.message)}}});document.addEventListener('click',e=>{let el=e.target.closest('[data-tab],[data-date],[data-remove],[data-habitremove],[data-action]');if(!el)return;if(el.dataset.tab){tab=el.dataset.tab;render()}else if(el.dataset.date){selected=el.dataset.date;render()}else if(el.dataset.remove){let [a,id]=el.dataset.remove.split(':');remove(a,id)}else if(el.dataset.habitremove){if(confirm('Remove this habit?')){state.habits=state.habits.filter(h=>h.id!==el.dataset.habitremove);save()}}else if(el.dataset.action){switch(el.dataset.action){case'prev':month=new Date(month.getFullYear(),month.getMonth()-1,1);render();break;case'next':month=new Date(month.getFullYear(),month.getMonth()+1,1);render();break;case'seedBall':{let start=new Date();for(let i=0;i<28;i++){let d=new Date(start);d.setDate(d.getDate()+i);if([1,3,5].includes(d.getDay())&&!state.events.some(x=>x.date===iso(d)&&x.title==='Basketball practice'))state.events.push({id:crypto.randomUUID(),date:iso(d),title:'Basketball practice',type:'Basketball',time:'',done:false})}save();break}case'export':{let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='snamberi-os-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);break}case'reset':if(confirm('Delete ALL local data? Export a backup first.')){state=structuredClone(defaults);save()}break}}});render();syncReminders();if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script>
<script id="snamberi-v2">
(function(){
const weekly=[
 {day:1,title:'Basketball practice',time:'Time not set',type:'Basketball'},
 {day:3,title:'Basketball practice',time:'Time not set',type:'Basketball'},
 {day:5,title:'Basketball practice',time:'Time not set',type:'Basketball'},
 {day:4,title:'School + IT Step',time:'08:00–22:00 approx.',type:'School',note:'School, quick meal at home, programming class, long commute. Game-dev rest day.'}
];
const weekday=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const dateOffset=(base,n)=>{const d=new Date(base.getFullYear(),base.getMonth(),base.getDate()+n);return iso(d)};
const startOfWeek=d=>{let x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-(x.getDay()+6)%7);return x};
function weekView(){
 const start=startOfWeek(new Date(selected+'T12:00:00'));let columns='';
 for(let i=0;i<7;i++){let date=dateOffset(start,i),dow=new Date(date+'T12:00:00').getDay();
 const recurring=weekly.filter(x=>x.day===dow).map(x=>({title:x.title,time:x.time,type:x.type,note:x.note}));
 const extra=state.events.filter(x=>x.date===date).map(x=>({title:x.title,time:x.time||'Time not set',type:x.type||'Event'}));
 const all=[...recurring,...extra];
 columns+=`<div class="week-day ${date===today()?'current':''}"><h3>${weekday[dow]}<br><span class="muted small">${date.slice(5)}</span></h3><div style="flex:1;min-width:0">${all.length?all.map(x=>`<div class="week-chip"><b>${esc(x.title)}</b><small>${esc(x.time)}</small>${x.note?`<small>${esc(x.note)}</small>`:''}</div>`).join(''):'<div class="week-chip muted">Open day</div>'}</div></div>`;
 }
 return card('Weekly schedule · '+iso(start),`<div class="week-grid">${columns}</div><p class="muted small" style="margin:13px 0 0">Basketball days are confirmed; exact times are not. Thursday is an approximate school/programming day. Gym goal: 5 sessions per week starting Nov 23 — choose your own days.</p>`);
}
function aiView(){return `<div class="glass-hero"><div class="small muted">PERSONAL ASSISTANT</div><h1>ChatGPT for your day</h1><p>Plan workouts, organize school, review habits and prepare for basketball. Opens ChatGPT securely; no API key is stored in this app.</p></div>`+
card('Ask ChatGPT',`<textarea id="aiPrompt" class="field" rows="4" placeholder="What should I focus on today?"></textarea><div class="ai-actions" style="margin-top:12px"><button class="btn" data-action="askAI">Ask ChatGPT ↗</button><button class="btn secondary" data-action="planAI">Plan my week ↗</button></div><p class="muted small">Your prompt opens in ChatGPT. This app does not automatically share your health logs or personal data.</p>`)+
card('Quick ideas',`<div class="stack"><button class="btn secondary" data-action="aiWorkout">Make a balanced 5-day gym plan</button><button class="btn secondary" data-action="aiSchool">Help organize my Thursday</button><button class="btn secondary" data-action="aiMeals">Suggest practical balanced meals</button></div>`);
}
function openAI(prompt){const text=prompt||document.getElementById('aiPrompt')?.value.trim()||'Help me plan my day';window.open('https://chatgpt.com/?q='+encodeURIComponent(text),'_blank');}
const originalRender=render;
render=function(){
 if(tab==='Week'){document.getElementById('levelPill').textContent=`Level ${level()} · ${xp()} XP`;document.getElementById('nav').innerHTML=tabs.map(t=>`<button class="${t===tab?'active':''}" data-tab="${t}">${t}</button>`).join('');document.getElementById('view').innerHTML=weekView();return}
 if(tab==='AI'){document.getElementById('levelPill').textContent=`Level ${level()} · ${xp()} XP`;document.getElementById('nav').innerHTML=tabs.map(t=>`<button class="${t===tab?'active':''}" data-tab="${t}">${t}</button>`).join('');document.getElementById('view').innerHTML=aiView();return}
 originalRender();
 if(tab==='Dashboard'){document.getElementById('view').insertAdjacentHTML('afterbegin',`<div class="glass-hero"><div class="small muted">YOUR PERSONAL COMMAND CENTER</div><h1>Make today count.</h1><p>School. Basketball. Training. Recovery. One place to keep your week together.</p></div>`+weekView())}
};
tabs.splice(1,0,'Week');tabs.push('AI');
document.addEventListener('click',e=>{const a=e.target.closest('[data-action]')?.dataset.action;if(!a)return;const prompts={planAI:'Create a practical weekly schedule for me. Basketball is Monday, Wednesday, Friday. Thursday is a long school and programming day, roughly 8 AM to 10 PM, and a game-development rest day. I want five gym visits a week starting November 23, but please account for recovery and let me adjust times.',aiWorkout:'Help me build a sustainable gym routine aiming for 5 visits weekly, alongside basketball Monday, Wednesday, Friday, with adequate recovery.',aiSchool:'Help me plan my Thursday: school in the morning, quick meal at home, two-hour programming class, long commute, home around 10 PM.',aiMeals:'Suggest affordable balanced meals and hydration habits for a busy student who plays basketball.'};if(a==='askAI'||a in prompts){e.preventDefault();openAI(prompts[a]);}});
render();
})();
</script></body></html>
